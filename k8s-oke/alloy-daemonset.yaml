apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy-agent
    app.kubernetes.io/part-of: lgtm-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-agent
    spec:
      serviceAccountName: alloy-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.0.0
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--storage.path=/var/lib/alloy/data"
            - "--server.http.listen-addr=0.0.0.0:12345"
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TEMPO_ENDPOINT
              value: "tempo.observability.internal:4317"
            - name: LOKI_ENDPOINT
              value: "http://loki.observability.internal:3100/loki/api/v1/push"
            - name: MIMIR_ENDPOINT
              value: "http://mimir.observability.internal:9009/api/v1/push"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
              protocol: TCP
            - name: internal-http
              containerPort: 12345
              protocol: TCP
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: storage
          emptyDir: {}
