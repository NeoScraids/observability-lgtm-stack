apiVersion: 1

datasources:
  # ============================================================================
  # Prometheus / Mimir Metrics Source
  # ============================================================================
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false

  # ============================================================================
  # Loki Logging Source (with Trace-to-Log Correlation Link)
  # ============================================================================
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "(?:trace_id|traceId|traceID|trace)=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  # ============================================================================
  # Tempo Distributed Tracing Source (with Trace-to-Logs & Metrics Links)
  # ============================================================================
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        tags:
          - key: "service.name"
            value: "app"
          - key: "k8s.pod.name"
            value: "pod"
        filterByTraceId: true
        filterBySpanId: false
        query: '{$${__tags}} |= "$${__trace.id}"'
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: "Request Rate (RPS)"
            query: 'sum(rate(http_requests_total{service_name="$${__span.service.name}"}[1m]))'
          - name: "Error Rate"
            query: 'sum(rate(http_requests_total{service_name="$${__span.service.name}",status=~"5.."}[1m]))'
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      search:
        hide: false
